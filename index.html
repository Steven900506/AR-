<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>項鍊線上 AR 試戴</title>
  
  <!-- 載入 3D 引擎與臉部追蹤庫 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: sans-serif; }
    
    /* 載入中遮罩 */
    #loading {
      position: absolute; inset: 0; background: rgba(0,0,0,0.85); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999; transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    
    /* 底部微調操作面板 (解決不同身形、領口高低問題) */
    .control-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
    }
    .control-btn {
      background: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .control-btn:active { background: #007bff; color: white; }
  </style>
</head>
<body>

  <!-- 載入提示 -->
  <div id="loading">
    <p>正在啟動鏡頭與 AR 引擎...</p>
  </div>

  <!-- 畫面上的微調按鈕：讓高矮胖瘦不同的使用者可以自己把項鍊喬到完美位置 -->
  <div class="control-panel">
    <button class="control-btn" onclick="adjustPos(0, 0.02, 0)">⬆️ 上</button>
    <button class="control-btn" onclick="adjustPos(0, -0.02, 0)">⬇️ 下</button>
    <button class="control-btn" onclick="adjustScale(0.05)">➕ 大</button>
    <button class="control-btn" onclick="adjustScale(-0.05)">➖ 小</button>
  </div>

  <!-- AR 場景 -->
  <a-scene 
    mindar-face="autoStart: true;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="necklaceModel" src="necklace.glb"></a-asset-item>
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>
    <a-light type="ambient" intensity="1.3"></a-light>
    <a-light type="directional" position="0 2 2" intensity="0.9"></a-light>

    <!-- 追蹤下巴錨點 (Index 152) -->
    <a-entity mindar-face-target="anchorIndex: 152">
      <a-gltf-model 
        id="necklace-entity"
        src="#necklaceModel" 
        position="0 -0.45 -0.1" 
        rotation="0 0 0" 
        scale="0.5 0.5 0.5"
        visible="false">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const loading = document.querySelector('#loading');
    const model = document.querySelector('#necklace-entity');

    // 啟動完成後隱藏載入畫面
    sceneEl.addEventListener('arReady', () => {
      loading.classList.add('hidden');
    });

    // 抓到臉部時顯示模型
    sceneEl.addEventListener("targetFound", () => {
      model.setAttribute('visible', 'true');
    });

    // 臉部離開時隱藏模型
    sceneEl.addEventListener("targetLost", () => {
      model.setAttribute('visible', 'false');
    });

    // 微調上下位置
    function adjustPos(x, y, z) {
      const pos = model.getAttribute('position');
      model.setAttribute('position', {x: pos.x + x, y: pos.y + y, z: pos.z + z});
    }

    // 微調大小
    function adjustScale(amount) {
      const scale = model.getAttribute('scale');
      const newScale = Math.max(0.1, scale.x + amount);
      model.setAttribute('scale', {x: newScale, y: newScale, z: newScale});
    }
  </script>

</body>
</html>
