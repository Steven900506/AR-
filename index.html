<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>項鍊線上 AR 試戴</title>
  
  <!-- 載入 3D 引擎與臉部追蹤庫 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
    
    /* 載入中遮罩 */
    #loading {
      position: absolute; inset: 0; background: rgba(0,0,0,0.85); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 999; transition: opacity 0.4s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    
    /* 可移動的底部微調操作面板 */
    .control-panel {
      position: absolute;
      bottom: 5%; /* 往下調整至更貼近底部 */
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.2);
      padding: 12px 20px;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .control-panel:active {
      cursor: grabbing;
    }
    .control-btn {
      background: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .control-btn:active { background: #007bff; color: white; }
  </style>
</head>
<body>

  <!-- 載入提示 -->
  <div id="loading">
    <p>正在啟動鏡頭與 AR 引擎...</p>
  </div>

  <!-- 可移動的微調按鈕面板 -->
  <div class="control-panel" id="controlPanel">
    <button class="control-btn" onclick="adjustPos(0, 0.02, 0)">⬆️ 上</button>
    <button class="control-btn" onclick="adjustPos(0, -0.02, 0)">⬇️ 下</button>
    <button class="control-btn" onclick="adjustScale(0.05)">➕ 大</button>
    <button class="control-btn" onclick="adjustScale(-0.05)">➖ 小</button>
  </div>

  <!-- AR 場景 -->
  <a-scene 
    mindar-face="autoStart: true;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="necklaceModel" src="necklace.glb"></a-asset-item>
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>
    <a-light type="ambient" intensity="1.3"></a-light>
    <a-light type="directional" position="0 2 2" intensity="0.9"></a-light>

    <!-- 追蹤下巴錨點 (Index 152) -->
    <a-entity mindar-face-target="anchorIndex: 152">
      <a-gltf-model 
        id="necklace-entity"
        src="#necklaceModel" 
        position="0 -0.45 -0.1" 
        rotation="0 0 0" 
        scale="0.5 0.5 0.5"
        visible="false">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl = document.querySelector('a-scene');
    const loading = document.querySelector('#loading');
    const model = document.querySelector('#necklace-entity');
    const panel = document.querySelector('#controlPanel');

    // 啟動完成後隱藏載入畫面
    sceneEl.addEventListener('arReady', () => {
      loading.classList.add('hidden');
    });

    // 抓到臉部時顯示模型
    sceneEl.addEventListener("targetFound", () => {
      model.setAttribute('visible', 'true');
    });

    // 臉部離開時隱藏模型
    sceneEl.addEventListener("targetLost", () => {
      model.setAttribute('visible', 'false');
    });

    // 微調上下位置
    function adjustPos(x, y, z) {
      const pos = model.getAttribute('position');
      model.setAttribute('position', {x: pos.x + x, y: pos.y + y, z: pos.z + z});
    }

    // 微調大小
    function adjustScale(amount) {
      const scale = model.getAttribute('scale');
      const newScale = Math.max(0.1, scale.x + amount);
      model.setAttribute('scale', {x: newScale, y: newScale, z: newScale});
    }

    // 實作面板的「可拖曳移動」功能（支援手機觸控與滑鼠）
    let isDragging = false;
    let startX, startY, startLeft, startTop;
    let hasMoved = false;

    panel.addEventListener('pointerdown', (e) => {
      isDragging = true;
      hasMoved = false;
      startX = e.clientX;
      startY = e.clientY;

      const rect = panel.getBoundingClientRect();
      startLeft = rect.left;
      startTop = rect.top;

      // 切換為絕對像素定位，以便自由拖曳
      panel.style.bottom = 'auto';
      panel.style.transform = 'none';
      panel.style.left = startLeft + 'px';
      panel.style.top = startTop + 'px';

      panel.setPointerCapture(e.pointerId);
    });

    panel.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
        hasMoved = true;
      }

      panel.style.left = (startLeft + dx) + 'px';
      panel.style.top = (startTop + dy) + 'px';
    });

    panel.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      try {
        panel.releasePointerCapture(e.pointerId);
      } catch (err) {}
    });

    // 如果發生拖曳，則攔截點擊事件，避免拖曳時誤觸按鈕
    panel.addEventListener('click', (e) => {
      if (hasMoved) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
  </script>

</body>
</html>
